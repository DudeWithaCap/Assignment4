<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Sign Up</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth-utils.js"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-box" id="loginBox">
      <div class="form-container">
        <h2>Login</h2>
        <div id="loginError" class="error hidden"></div>
        <form id="loginForm">
          <div>
            <label>Email</label>
            <input type="email" id="loginEmail" required>
          </div>
          <div>
            <label>Password</label>
            <input type="password" id="loginPassword" required>
          </div>
          <button type="submit" class="btn-primary">Login</button>
        </form>
        <div class="toggle-link">
          Don't have an account? <a onclick="toggleForms()">Sign up</a>
        </div>
      </div>
    </div>

    <div class="auth-box hidden" id="signupBox">
      <div class="form-container">
        <h2>Sign Up</h2>
        <div id="signupError" class="error hidden"></div>
        <form id="signupForm">
          <div>
            <label>Username</label>
            <input type="text" id="signupUsername" required minlength="3">
          </div>
          <div>
            <label>Email</label>
            <input type="email" id="signupEmail" required>
          </div>
          <div>
            <label>Password</label>
            <input type="password" id="signupPassword" required minlength="6">
          </div>
          <div>
            <label>Confirm Password</label>
            <input type="password" id="signupConfirmPassword" required>
          </div>
          <button type="submit" class="btn-primary">Sign Up</button>
        </form>
        <div class="toggle-link">
          Already have an account? <a onclick="toggleForms()">Login</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/auth';

    function toggleForms() {
      document.getElementById('loginBox').classList.toggle('hidden');
      document.getElementById('signupBox').classList.toggle('hidden');
      document.getElementById('loginError').classList.add('hidden');
      document.getElementById('signupError').classList.add('hidden');
    }

    function showError(errorId, message) {
      const errorBox = document.getElementById(errorId);
      errorBox.textContent = message;
      errorBox.classList.remove('hidden');
      setTimeout(() => {
        errorBox.classList.add('hidden');
      }, 5000);
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          showError('loginError', data.message || 'Login failed');
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        window.location.href = '/frontend/index.html';
      } catch (err) {
        showError('loginError', 'An error occurred. Please try again.');
        console.error('Login error:', err);
      }
    });

    document.getElementById('signupForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const username = document.getElementById('signupUsername').value;
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      const confirmPassword = document.getElementById('signupConfirmPassword').value;

      if (password !== confirmPassword) {
        showError('signupError', 'Passwords do not match');
        return;
      }

      try {
        const response = await fetch(`${API_URL}/signup`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, email, password, confirmPassword })
        });

        const data = await response.json();

        if (!response.ok) {
          showError('signupError', data.message || 'Sign up failed');
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        window.location.href = '/frontend/index.html';
      } catch (err) {
        showError('signupError', 'An error occurred. Please try again.');
        console.error('Sign up error:', err);
      }
    });

    window.addEventListener('load', function() {
      const token = localStorage.getItem('token');
      if (token) {
        window.location.href = '/frontend/index.html';
      }
    });
  </script>
</body>
</html>
